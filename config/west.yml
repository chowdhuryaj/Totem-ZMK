manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: chowdhuryaj
      url-base: https://github.com/chowdhuryaj
    - name: urob
      url-base: https://github.com/urob
    - name: ssbb
      url-base: https://github.com/ssbb
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
    - name: zzeneg
      url-base: https://github.com/zzeneg
    - name: carrefinho
      url-base: https://github.com/carrefinho

  projects:
    - name: zmk
      remote: zmkfirmware
      # Same pin as the Imprint (main @ 2026-06-29) so both boards build the
      # same ZMK; bump deliberately, together.
      revision: 484a0547078228f6957ed164523823e39fbedec4
      import: app/west.yml

    # The TOTEM shield is VENDORED under boards/shields/totem (MIT,
    # from GEIGEIGEIST/zmk-config-totem): upstream is a 2023 user config,
    # not a west module, and its shield predates Zephyr 4.1 board names and
    # ZMK Studio's physical layout. No keyboards project needed here.

    - name: zmk-adaptive-key
      remote: urob
      # main @ 2026-10-26, pinned (supply chain: a branch push must not
      # change the image). Bump deliberately.
      revision: e987227d625e8863343baf16bd11ff90310482a5
      path: modules/zmk/adaptive-key

    # urob behavior modules come from `main` (pinned by SHA) — our zmk pin is
    # main (post-v0.3), and the v0.3 tags call pre-Studio keymap APIs.
    - name: zmk-auto-layer
      # Our fork: urob main + Studio parameter metadata (LAYER_ID param1)
      # so &num_word is app-assignable. Repoint to urob main if it merges.
      # flask-metadata @ 2026-10-26, pinned. Bump deliberately.
      remote: chowdhuryaj
      revision: b1f49178e1cbd482749bdd342fedd3df425ea823

    - name: zmk-tri-state
      remote: urob
      # main @ 2026-10-26, pinned (supply chain: a branch push must not
      # change the image). Bump deliberately.
      revision: c08969627245adeddbcdb6dfc1a4c167c04160e2

    - name: zmk-listeners
      remote: ssbb
      # v1 @ 2026-10-26, pinned (supply chain: a branch push must not
      # change the image). Bump deliberately.
      revision: c240ceaf353d3138bea7695eef17049b7ade995b

    - name: zmk-leader-key
      remote: urob
      # main @ 2026-10-26, pinned (supply chain: a branch push must not
      # change the image). Bump deliberately.
      revision: 4745294d5f2bc12bbdf91471dd85bfbdbb35c47d

    - name: zmk-flask-modules
      remote: chowdhuryaj
      # Branch `unify` (totem line + autoshift + mousekeys, proto v23: tap dance holds, release window, eager), shared
      # with the Imprint. Pinned by SHA so a branch push never changes this
      # image; bump deliberately, together with Cyboard-ZMK (still on
      # 28b8b8b / v19).
      revision: d15993a722b544e523666436ae3fc5c6c4c191f9

    - name: zmk-switch-layout
      remote: mctechnology17
      # main @ 2026-10-26, pinned (supply chain: a branch push must not
      # change the image). Bump deliberately.
      revision: e6e1802dd00f46d58c35c88d9b35a69f4bed9b88

    - name: zmk-raw-hid
      # AJ's fork, branch `transport-scoped` (on zzeneg main 6a37765, the
      # 2026-08-23 static-buffer USB fix): replies go only to the transport
      # the request came in on (upstream sent every reply to USB AND BLE),
      # and CONFIG_RAW_HID_USB=n drops the USB raw HID interface (dongle).
      # This module IS the Flask transport. Pinned; bump deliberately.
      remote: chowdhuryaj
      revision: 6cf315aa69eafbbf7d6ca9691c945e0fd663f2bb

    # Prospector display dongle: status screen shield `prospector_adapter` for
    # the totem_dongle build. `feat/new-status-screens` is the Zephyr 4.1
    # branch (its `main` is v0.3-only); pinned to a SHA because it is a
    # work-in-progress branch.
    - name: prospector-zmk-module
      remote: carrefinho
      revision: ed98221f3b52b7066dbb10ba3af8a29150b93a5a

    # Endgame trackball as a BLE HID host on the dongle (central). AJ's fork,
    # `endgame` branch: adds pair-name-prefix so pairing picks the Endgame by
    # name. Pinned to the branch tip 3d38606 (2026-10-26, "Stop only our own
    # scan..."): it runs on the dongle beside the phone remote, so a branch
    # push must not change the image. Bump deliberately.
    - name: zmk-ble-mouse-host
      remote: chowdhuryaj
      revision: 3d386062180f7274eee636961f5e881373436bc4

  self:
    path: config

manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: chowdhuryaj
      url-base: https://github.com/chowdhuryaj
    - name: urob
      url-base: https://github.com/urob
    - name: ssbb
      url-base: https://github.com/ssbb
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
    - name: zzeneg
      url-base: https://github.com/zzeneg
    - name: carrefinho
      url-base: https://github.com/carrefinho

  projects:
    - name: zmk
      # AJ's fork, branch `mouse-8-buttons`: zmkfirmware main 484a054 (same
      # base as the Imprint) + an 8-button mouse HID descriptor, so the
      # dongle's BLE mouse buttons 6-8 reach macOS natively (re-pair BLE hosts
      # after flashing: cached 5-button report map) + split central retries a
      # failed scan start (upstream stuck after one failure, e.g. while the
      # mouse host's own scan held the scanner) + BT_SMP_SC_PAIR_ONLY as
      # imply with hosts kept SC-only in pairing_accept (legacy-pairing
      # mice on the dongle) + Studio falls back to the first built transport
      # when none matches the output (dongle on USB: BLE Studio). Bump
      # deliberately.
      remote: chowdhuryaj
      revision: 78cace17fbb0062222d6bc9a1fe5e9db81dbea56
      import: app/west.yml

    # The TOTEM shield is VENDORED under boards/shields/totem (MIT,
    # from GEIGEIGEIST/zmk-config-totem): upstream is a 2023 user config,
    # not a west module, and its shield predates Zephyr 4.1 board names and
    # ZMK Studio's physical layout. No keyboards project needed here.

    - name: zmk-adaptive-key
      remote: urob
      # main @ 2026-10-26, pinned (supply chain: a branch push must not
      # change the image). Bump deliberately.
      revision: e987227d625e8863343baf16bd11ff90310482a5
      path: modules/zmk/adaptive-key

    # urob behavior modules come from `main` (pinned by SHA) — our zmk pin is
    # main (post-v0.3), and the v0.3 tags call pre-Studio keymap APIs.
    - name: zmk-auto-layer
      # Our fork: urob main + Studio parameter metadata (LAYER_ID param1)
      # so &num_word is app-assignable. Repoint to urob main if it merges.
      # flask-metadata @ 2026-10-26, pinned. Bump deliberately.
      remote: chowdhuryaj
      revision: b1f49178e1cbd482749bdd342fedd3df425ea823

    - name: zmk-tri-state
      remote: urob
      # main @ 2026-10-26, pinned (supply chain: a branch push must not
      # change the image). Bump deliberately.
      revision: c08969627245adeddbcdb6dfc1a4c167c04160e2

    - name: zmk-listeners
      remote: ssbb
      # v1 @ 2026-10-26, pinned (supply chain: a branch push must not
      # change the image). Bump deliberately.
      revision: c240ceaf353d3138bea7695eef17049b7ade995b

    - name: zmk-leader-key
      remote: urob
      # main @ 2026-10-26, pinned (supply chain: a branch push must not
      # change the image). Bump deliberately.
      revision: 4745294d5f2bc12bbdf91471dd85bfbdbb35c47d

    - name: zmk-flask-modules
      remote: chowdhuryaj
      # Branch `mouse-host` = `unify` d15993a (totem line + autoshift +
      # mousekeys, proto v23: tap dance holds, release window, eager) + one
      # weak hook, flask_proto_ext_handle(), so this repo owns the mouse host
      # channel 0x2E (docs/mouse-host.md). Protocol otherwise unchanged; the
      # Imprint can stay on unify. 2026-11-22 (proto v24): + flask_scroll
      # vertical priority (0x15 value 0x0B) and flask_smooth (channel 0x13),
      # both inert where not instantiated. Pinned by SHA so a branch push
      # never changes this image; bump deliberately, together with
      # Cyboard-ZMK (still on 28b8b8b / v19).
      revision: 2dc150f72d2e2faecae5ae74952c2ffc14bd7a72

    - name: zmk-switch-layout
      remote: mctechnology17
      # main @ 2026-10-26, pinned (supply chain: a branch push must not
      # change the image). Bump deliberately.
      revision: e6e1802dd00f46d58c35c88d9b35a69f4bed9b88

    - name: zmk-raw-hid
      # AJ's fork, branch `transport-scoped` (on zzeneg main 6a37765, the
      # 2026-08-23 static-buffer USB fix): replies go only to the transport
      # the request came in on (upstream sent every reply to USB AND BLE),
      # and CONFIG_RAW_HID_USB=n drops the USB raw HID interface (dongle).
      # BLE replies go to the host that wrote the request, not the active
      # profile. RAW_HID_TRANSPORT_EXT lets the phone remote's Flask tunnel
      # (docs/phone-remote.md) be a third transport. This module IS the Flask
      # transport. Pinned; bump deliberately.
      remote: chowdhuryaj
      revision: da7c14752b6d2f8316b6d440ae3747971653c1c2

    # Prospector display dongle: status screen shield `prospector_adapter` for
    # the totem_dongle build. `feat/new-status-screens` is the Zephyr 4.1
    # branch (its `main` is v0.3-only); pinned to a SHA because it is a
    # work-in-progress branch.
    - name: prospector-zmk-module
      remote: carrefinho
      revision: ed98221f3b52b7066dbb10ba3af8a29150b93a5a

    # BLE mouse host on the dongle (central). AJ's fork, `remap` branch =
    # `endgame` f3d145c (pair-name-prefix, buttons 6-8 as INPUT_BTN_5..7) +
    # list scan, pair by address, status API and state event (2026-11-22,
    # docs/mouse-host.md). It runs on the dongle beside the phone remote, so
    # a branch push must not change the image. Bump deliberately.
    - name: zmk-ble-mouse-host
      remote: chowdhuryaj
      revision: aa80aaececd205b831906531e49abbbe6a73c8a1

  self:
    path: config

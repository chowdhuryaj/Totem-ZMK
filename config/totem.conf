# Ported from the Imprint's imprint.conf (Cyboard-ZMK flask-parity). Dropped:
# every PMW3610 setting (no trackballs) and the RGB block (RGB_UNDERGLOW /
# LED_STRIP / ZMK_FLASK_RGB) — the TOTEM has no LED strip, so flask_rgb
# (channel 0x21) answers unhandled.

# Flask meta family id (meta 0x03). Every ZMK board shares VID/PID
# 1d50:615e, so this is how the apps tell a Totem from an Imprint.
# 1=adept 2=svalboard 3=nlkb16 4=imprint 5=gmk70 6=totem. Needs zmk-flask-modules
# branch `totem` (adds the Kconfig symbol; default 4).
CONFIG_ZMK_FLASK_FAMILY=6

CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

# Crash forensics: meta 0x04 answers the boot reset-cause bits (software /
# CPU lockup / watchdog reads as a fault-reboot after a bench "crash").
CONFIG_HWINFO=y

# Flask runtime-tuning protocol over raw HID (zmk-flask-modules). RAW_HID
# itself comes from the raw_hid_adapter shield on the left/central build;
# this stays inert on the right half.
CONFIG_ZMK_FLASK_PROTO=y

# Raw-HID reports are 32 bytes but Zephyr's legacy HID class defaults the
# interrupt endpoint MPS to 16, so every input report crosses the wire as
# two packets. On macOS (Darwin 25.x) that multi-packet profile corrupts
# bytes 24-31 of every 32-byte Flask frame in BOTH directions with one
# stale kernel buffer (Imprint v14 bench, proven by native-hidapi probe
# 2026-07-13). LOAD-BEARING — keep it. Applies to both HID instances
# (keyboard reports are <=16 B and unaffected).
CONFIG_HID_INTERRUPT_EP_MPS=32

# nRF USB work queue stack (Zephyr default 1024). Every Flask frame is
# handled on this thread: raw-hid callback, flask_proto, then the reply's
# USB send AND BLE notify, plus log formatting on the logging image
# (CONFIG_LOG_MODE_IMMEDIATE formats on the caller's stack). HW stack
# protection turns an overflow into a reboot. +1 KB RAM. Sweep F03/F05.
CONFIG_USB_NRFX_WORK_QUEUE_STACK_SIZE=2048

# Flask runtime combos (channel 0x24) — the keymap's flask,combos-defaults
# node seeds the slots; app edits win on boot. Central-only source; no DT
# node, so the symbol is set here explicitly.
CONFIG_ZMK_FLASK_COMBOS=y

# Flask runtime macros (channel 0x25) — &fmac <slot>. Engine symbol set
# explicitly (central-only source); the &fmac keymap node auto-enables just
# the behavior. Capacities are Kconfig (defaults: 32 slots x 32 steps;
# combos 64 slots x 8 keys), persisted per slot.
CONFIG_ZMK_FLASK_MACROS=y

# Flask runtime leader (channel 0x19) — &fled. urob's compile-time &leader
# (email/USB/BLE) is unaffected.
CONFIG_ZMK_FLASK_LEADER=y

# Custom shift keys (channel 0x16) — QMK custom_shift_keys analog.
# Keycode-event hook, central-only source, no DT node.
CONFIG_ZMK_FLASK_CSK=y

# Runtime tap dances (channel 0x28) — &ftd <slot>.
CONFIG_ZMK_FLASK_TAPDANCE=y

# Runtime hold-tap timing (channel 0x2A, proto v17) — &fht_l / &fht_r /
# &fht read term, flavor, quick-tap and prior-idle from a per-key-position
# slot table. Central-only source; set explicitly like tapdance.
CONFIG_ZMK_FLASK_HOLDTAP=y

# Runtime adaptive keys (channel 0x2B, proto v18) — &fak <set>. Rules are
# seeded from ak_rti / ak_alt via the fak_defaults node. Central-only source;
# set explicitly like tapdance.
CONFIG_ZMK_FLASK_ADAPTIVE=y

CONFIG_ZMK_ADAPTIVE_KEY_MAX_BINDINGS=6

# Latched layers auto-exit (zmk-flask-modules flask_layer_autoexit): a layer
# on with no key holding it (&tog / &to / smart_layer tap) turns off when a
# key that is &trans on it is pressed, and the press falls through. Combo /
# &mo / layer-tap holds never exit; &num_word (locked) keeps its own exit.
# Needs a zmk-flask-modules revision that defines the symbol.
CONFIG_ZMK_FLASK_LAYER_AUTOEXIT=y

# For split keyboards:
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

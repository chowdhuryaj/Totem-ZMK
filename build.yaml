# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# (template comment trimmed)
---
include:
  # BISECT ONLY (branch mouse-bisect): boot hang of the SC_PAIR_ONLY=n image.
  # B = current code, SC-only on (no reset needed). C = SC-only off + 2 KB main stack (settings_reset all 3 first).
  - board: xiao_ble//zmk
    shield: totem_dongle prospector_adapter raw_hid_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_RAW_HID_USB=n -DCONFIG_LV_Z_VDB_SIZE=25 -DCONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n -DCONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
    artifact-name: totem_dongle_no_als_B
  - board: xiao_ble//zmk
    shield: totem_dongle prospector_adapter raw_hid_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_RAW_HID_USB=n -DCONFIG_LV_Z_VDB_SIZE=25 -DCONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n -DCONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80 -DCONFIG_BT_SMP_SC_PAIR_ONLY=n -DCONFIG_MAIN_STACK_SIZE=2048
    artifact-name: totem_dongle_no_als_C
